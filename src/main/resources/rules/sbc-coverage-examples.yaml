# SBC coverage-example claims, from the CMS calculation guides (T-007).
# Source: CMS CCIIO 'Summary of Benefits and Coverage' resources, SBC template for plan or
# policy years beginning on or after January 1, 2021 (guides revised 2023-06-07).
# https://www.cms.gov/cciio/Resources/Forms-Reports-and-Other-Resources/index
# Allowed amounts are copied exactly as published, including sub-cent values. The rules
# loader rounds each line to cents (half up) before use; see docs/research/cms-coverage-examples.md.
# Billing and diagnosis codes are not copied. CPT short descriptors are AMA text, so CPT
# lines carry a plain label written for Cairn (director decision, 2026-11-23).
# The guides show OMB control number 0938-1146 with expiration 05/31/2026; no renewed
# version was published as of 2026-11-23. Re-verify on every rules review.
version: 1
template_edition: "2021"
effective_from: 2021-01-01
verified_on: 2026-11-23
source_page: https://www.cms.gov/cciio/Resources/Forms-Reports-and-Other-Resources/index
category_mapping:
  - cms_category: "Ambulance"
    service: emergency_transport
    status: mapped
    reason: "SBC row 'Emergency medical transportation'"
  - cms_category: "Emergency Department: Facility"
    service: er_facility
    status: mapped
    reason: "SBC row 'Emergency room care' (facility fee)"
  - cms_category: "Professional Services: Emergency Department"
    service: er_physician
    status: mapped
    reason: "SBC row 'Emergency room care' (physician fee)"
  - cms_category: "Other Facility Services"
    service: null
    status: needs_director
    reason: "fiberglass cast supplies billed at the specialist cast visit on the outpatient hospital claim; no surgery took place, so 'Outpatient surgery: facility fee' is not a clean fit; plans may treat it as part of the specialist visit, as supplies, or as a facility fee"
  - cms_category: "Durable Medical Equipment"
    service: durable_medical_equipment
    status: mapped
    reason: "SBC row 'Durable medical equipment'"
  - cms_category: "Professional Services: Specialist"
    service: specialist
    status: mapped
    reason: "SBC row 'Specialist visit'"
  - cms_category: "Professional Services: Primary Care"
    service: primary_care
    status: mapped
    reason: "SBC row 'Primary care visit'; includes the diabetes educator and dietitian lines"
  - cms_category: "Professional Services: Physical Therapy"
    service: rehabilitation
    status: mapped
    reason: "SBC row 'Rehabilitation services'"
  - cms_category: "Diagnostic Services: Radiology"
    service: diagnostic_test
    status: mapped
    reason: "SBC row 'Diagnostic test (x-ray, blood work)'; these are x-rays and ultrasounds, not CT/PET/MRI"
  - cms_category: "Diagnostic Services: Laboratory"
    service: diagnostic_test
    status: mapped
    reason: "SBC row 'Diagnostic test (x-ray, blood work)'"
  - cms_category: "Prescription Drugs: Generic"
    service: generic_rx
    status: mapped
    reason: "SBC row 'Generic drugs'"
  - cms_category: "Preventive Services & Vaccines"
    service: preventive
    status: mapped
    reason: "SBC row 'Preventive care/screening/immunization'"
  - cms_category: "Inpatient Hospital Care (Facility)"
    service: childbirth_facility
    status: mapped
    reason: "the stay is a vaginal delivery; SBC row 'Childbirth/delivery facility services'"
  - cms_category: "Professional Services: Inpatient"
    service: childbirth_professional
    status: mapped
    reason: "delivery anesthesia is a professional service at the delivery; SBC row 'Childbirth/delivery professional services'; the template example labels it 'Specialist visit (anesthesia)' (director decision, 2026-11-23)"
  - cms_category: "Professional Services: Obstetric Care (Bundled)"
    service: null
    status: needs_director
    reason: "global obstetric fee of $2,609.93 dated at the first prenatal visit (2016-04-01), not at delivery; its follow-up visits are $0 lines; the template example lists this care as 'Specialist office visits (prenatal care)'; candidate rows: 'prenatal_postnatal_office', 'specialist' or 'childbirth_professional' (re-decision needed: the first decision relied on a wrong statement that it was billed at delivery)"
  - cms_category: "Prescription Drugs: Insulin"
    service: generic_rx
    status: mapped
    reason: "CMS assumption on the guide's Label and Assumptions sheet: 'All medications are covered as generic equivalents if available' (director decision, 2026-11-23)"
  - cms_category: "Medical Supplies"
    service: durable_medical_equipment
    status: mapped
    reason: "the SBC template's diabetes example lists 'Durable medical equipment (glucose meter)' (director decision, 2026-11-23)"
  - cms_category: "Over-the-counter Drugs"
    service: null
    status: excluded
    reason: "no SBC service row and normally not covered; the full amount counts under 'Limits or exclusions' (director decision, 2026-11-23)"
