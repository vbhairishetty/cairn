services:
  postgres:
    # Exact tag, also read by the Testcontainers configuration in src/test.
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_DB: cairn
      POSTGRES_USER: ${CAIRN_DB_USER:-cairn}
      POSTGRES_PASSWORD: ${CAIRN_DB_PASSWORD:?Set CAIRN_DB_PASSWORD (copy the example env file to .env and edit it)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cairn-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d cairn"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cairn-pgdata:
